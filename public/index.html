<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aniwave HLS Player</title>
  <style>body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;height:100vh}video{width:100%;height:auto;max-width:960px}</style>
</head>
<body>
  <video id="video" controls autoplay playsinline></video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById('video');
    // Edit this to point to the playlist your Codespace serves, or a direct stream URL
    const playlist = '/hls/playlist.m3u8';

    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // native HLS (Safari, iOS)
      video.src = playlist;
    } else if (window.Hls) {
      const hls = new Hls();
      hls.loadSource(playlist);
      hls.attachMedia(video);
    } else {
      document.body.innerHTML = '<p style="color:white">HLS not supported in this browser.</p>';
    }
  </script>
</body>
</html>
